# nginx untuk Lolos MCP. Simpan sebagai /etc/nginx/sites-available/lolos-mcp
#
# Satu hal yang paling sering merusak MCP di balik nginx: buffering. Streamable
# HTTP mempertahankan respons terbuka; proxy yang menyangga respons membuat
# klien menggantung tanpa error yang jelas. Tiga baris di bawah bukan opsional.

server {
    listen 80;
    listen [::]:80;
    server_name mcp.contoh.com;

    # Batas body 4 MiB, sama dengan default SDK.
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Wajib: jangan sangga stream.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;

        # Token tidak boleh masuk access log.
        access_log /var/log/nginx/lolos-mcp.access.log;
    }

    # /health terbuka; jangan tambahkan auth di sini kalau monitor memakainya.
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
